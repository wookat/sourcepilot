server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # API 与静态文件一律走后端；前端不直连第三方 AI / 平台 / Collector
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 前端构建产物（webpack 哈希资源）也输出在 /static/ 下：先找本地文件，找不到再代理后端上传文件
  location ^~ /static/ {
    try_files $uri @backend_static;
  }

  location @backend_static {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health-backend {
    proxy_pass http://backend:8080/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # index.html 不缓存：始终拿到引用最新 hash 资源的入口
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 带 contenthash 的构建产物可长缓存
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
