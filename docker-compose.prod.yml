# TradeMind — 生产部署 Compose（Caddy HTTPS + PostgreSQL + Redis + backend + admin + collector）
# 使用方式：复制 .env.prod.example 为 .env 并填入必填项后执行
#   docker compose -f docker-compose.prod.yml up -d --build
# 与 docker-compose.full.yml 的区别：
# - 增加 Caddy 反向代理，自动申请 Let's Encrypt 证书（域名走 DOMAIN 环境变量）
# - backend / collector / postgres / redis / admin 均不暴露公网端口，仅 Caddy 监听 80/443
# 详见 docs/production-deployment.md

name: trademind-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?必须在 .env 中设置 DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - trademind_prod_caddy_data:/data
      - trademind_prod_caddy_config:/config
    depends_on:
      admin:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:2019/metrics || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trademind}
      POSTGRES_USER: ${POSTGRES_USER:-trademind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置强随机 POSTGRES_PASSWORD}
    volumes:
      - trademind_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - trademind_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 编排约定：容器内固定监听 3001，仅编排网络内可达，不映射宿主机端口
      COLLECTOR_HTTP_ADDR: ":3001"
      COLLECTOR_BROWSER_PROFILE_DIR: /workspace/data/browser-profiles
      COLLECTOR_STORAGE_STATE_DIR: /workspace/data/storage-states
      NODE_ENV: production
    volumes:
      - ./data/browser-profiles:/workspace/data/browser-profiles
      - ./data/storage-states:/workspace/data/storage-states
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3001/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 仅编排网络内可达，不映射宿主机端口；外部流量一律经 Caddy → admin(nginx) → backend
      APP_HTTP_ADDR: ":8080"
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      COLLECTOR_BASE_URL: http://collector:3001
    volumes:
      - trademind_prod_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:80/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  trademind_prod_pg_data:
  trademind_prod_redis_data:
  trademind_prod_uploads:
  trademind_prod_caddy_data:
  trademind_prod_caddy_config:
